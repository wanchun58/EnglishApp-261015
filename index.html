<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEURAL_LEXICON // 賽博龐克英文聽讀特訓系統</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Share+Tech+Mono&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030712;
            --panel-bg: rgba(10, 15, 30, 0.85);
            --primary: #00f0ff;
            --primary-glow: rgba(0, 240, 255, 0.4);
            --secondary: #7000ff;
            --success: #00ff66;
            --danger: #ff0055;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --border: #1e293b;
            --border-glow: #00f0ff55;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Noto Sans TC', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 網格與掃描線背景特效 */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            z-index: 999;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 20px;
            box-shadow: 0 4px 20px var(--primary-glow);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            color: var(--primary);
            letter-spacing: 3px;
            text-shadow: 0 0 10px var(--primary);
            margin-bottom: 8px;
        }

        .subtitle {
            font-family: 'Share Tech Mono', monospace;
            color: var(--text-muted);
            font-size: 1rem;
            letter-spacing: 1px;
        }

        /* 儀表板統計列 */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 15px;
            text-align: center;
            box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.05);
        }

        .stat-title {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: var(--primary);
        }

        /* 主佈局 */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 25px;
        }

        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
        }

        /* 訓練大卡片 */
        .trainer-box {
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 420px;
            position: relative;
        }

        .word-badge {
            font-family: 'Share Tech Mono', monospace;
            background: rgba(0, 240, 255, 0.1);
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: inline-block;
            margin-bottom: 15px;
            align-self: center;
        }

        .current-word {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .phonetic {
            font-family: 'Share Tech Mono', monospace;
            color: var(--primary);
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .translation {
            font-size: 1.2rem;
            color: var(--text-main);
            margin-bottom: 15px;
            font-weight: bold;
        }

        .example-sentence {
            font-style: italic;
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 25px;
            padding: 0 20px;
        }

        /* 互動按鈕群 */
        .action-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .cyber-btn {
            font-family: 'Orbitron', sans-serif;
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px var(--primary-glow);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .cyber-btn:hover {
            background: var(--primary);
            color: var(--bg-color);
            box-shadow: 0 0 20px var(--primary);
        }

        .cyber-btn.record-btn {
            border-color: var(--success);
            color: var(--success);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
        }

        .cyber-btn.record-btn:hover, .cyber-btn.record-btn.recording {
            background: var(--success);
            color: var(--bg-color);
            box-shadow: 0 0 25px var(--success);
            animation: pulse 1.5s infinite;
        }

        .cyber-btn.star-btn {
            border-color: #ffd700;
            color: #ffd700;
        }
        .cyber-btn.star-btn.starred {
            background: #ffd700;
            color: #000;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* 辨識結果與波形回饋區 */
        .feedback-box {
            font-family: 'Share Tech Mono', monospace;
            padding: 12px;
            border-radius: 4px;
            background: rgba(0,0,0,0.5);
            border: 1px dashed var(--border);
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 5px;
        }

        .result-correct {
            color: var(--success);
            font-weight: bold;
            text-shadow: 0 0 8px var(--success);
        }

        .result-wrong {
            color: var(--danger);
            font-weight: bold;
            text-shadow: 0 0 8px var(--danger);
        }

        /* 導航按鈕 */
        .nav-controls {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        /* 側邊欄：單字清單與過濾 */
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .sidebar-header h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: var(--primary);
        }

        .filter-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            border-radius: 4px;
            font-family: 'Share Tech Mono', monospace;
            transition: 0.2s;
        }

        .tab-btn.active {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(0, 240, 255, 0.1);
        }

        .word-list {
            max-height: 450px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 5px;
        }

        .word-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            padding: 10px 12px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }

        .word-item:hover {
            border-color: var(--primary);
            background: rgba(0, 240, 255, 0.05);
        }

        .word-item.active {
            border-color: var(--primary);
            background: rgba(0, 240, 255, 0.15);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .word-item-info .en {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            color: #fff;
        }

        .word-item-info .zh {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* 卷軸美化 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>NEURAL_LEXICON</h1>
            <div class="subtitle">// 賽博龐克 AI 智慧發音與聽讀特訓系統 (100 字庫)</div>
        </header>

        <!-- 儀表板 -->
        <div class="dashboard">
            <div class="stat-card">
                <div class="stat-title">SYSTEM_COMBO</div>
                <div class="stat-value" id="comboCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">ACCURACY</div>
                <div class="stat-value" id="accuracyRate">0%</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">ERROR_QUEUE</div>
                <div class="stat-value" id="errorQueueCount" style="color: var(--danger);">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">MASTERED</div>
                <div class="stat-value" id="masteredCount" style="color: var(--success);">0 / 100</div>
            </div>
        </div>

        <div class="main-grid">
            <!-- 訓練主面板 -->
            <div class="panel trainer-box">
                <div id="wordBadge" class="word-badge">INDEX: #001 // LEVEL: 核心單字</div>
                <div id="currentWord" class="current-word">SYNCHRONIZING</div>
                <div id="currentPhonetic" class="phonetic">[ ... ]</div>
                <div id="currentTranslation" class="translation">載入中...</div>
                <div id="currentExample" class="example-sentence">"Loading example sentence..."</div>

                <div class="action-group">
                    <button class="cyber-btn" onclick="speakCurrentWord()">
                        🔊 播放發音
                    </button>
                    <button id="recordBtn" class="cyber-btn record-btn" onclick="toggleRecord()">
                        🎤 開始跟讀
                    </button>
                    <button id="starBtn" class="cyber-btn star-btn" onclick="toggleStarCurrent()">
                        ⭐ 加入精選
                    </button>
                </div>

                <div class="feedback-box" id="feedbackBox">
                    <span style="color: var(--text-muted)">請點擊「開始跟讀」並念出上方單字進行神經語音比對</span>
                </div>

                <div class="nav-controls">
                    <button class="cyber-btn" onclick="prevWord()">◀ 上一個</button>
                    <button class="cyber-btn" onclick="nextWord()">下一個 ▶</button>
                </div>
            </div>

            <!-- 側邊字庫面板 -->
            <div class="panel">
                <div class="sidebar-header">
                    <h3>LEXICON DATABASE</h3>
                    <span id="listCounter" style="font-family:'Share Tech Mono'; font-size:0.8rem; color:var(--primary);">100 Words</span>
                </div>
                <div class="filter-tabs">
                    <button class="tab-btn active" onclick="switchFilter('all', this)">全部 (100)</button>
                    <button class="tab-btn" onclick="switchFilter('starred', this)">精選</button>
                    <button class="tab-btn" onclick="switchFilter('errors', this)">錯題特訓</button>
                </div>
                <div class="word-list" id="wordListContainer">
                    <!-- 動態生成 100 單字清單 -->
                </div>
            </div>
        </div>
    </div>

            { en: "icon", phonetic: "/ˈaɪkɑːn/", zh: "圖示", ex: "Click the gear icon to open settings." },
            { en: "java", phonetic: "/ˈdʒɑːvə/", zh: "Java 語言", ex: "Enterprise backend systems often use Java." },
            { en: "keyboard", phonetic: "/ˈkiːbɔːrd/", zh: "鍵盤", ex: "Mechanical keyboards offer great tactile feedback." },
            { en: "link", phonetic: "/lɪŋk/", zh: "連結", ex: "Click the download link to get the installer." },
            { en: "macro", phonetic: "/ˈmækroʊ/", zh: "巨集", ex: "Excel macros automate repetitive tasks." },
            { en: "navigation", phonetic: "/ˌnævɪˈɡeɪʃn/", zh: "導航", ex: "Clear website navigation improves UX." },
            { en: "output", phonetic: "/ˈaʊtˌpʊt/", zh: "輸出", ex: "Check the console for program output." },
            { en: "plugin", phonetic: "/ˈplʌɡˌɪn/", zh: "外掛程式", ex: "Install a SEO plugin for your WordPress site." },
            { en: "quantum", phonetic: "/ˈkwɑːntəm/", zh: "量子", ex: "Quantum bits can exist in multiple states." },
            { en: "release", phonetic: "/rɪˈliːs/", zh: "發布", ex: "Version 2.0 is scheduled for release tomorrow." },
            { en: "source", phonetic: "/sɔːrs/", zh: "原始碼", ex: "Open source projects encourage collaboration." },
            { en: "tablet", phonetic: "/ˈtæblɪt/", zh: "平板電腦", ex: "Designers use tablets for digital sketching." },
            { en: "utility", phonetic: "/juːˈtɪlɪti/", zh: "公用程式", ex: "System utilities help maintain peak performance." },
            { en: "virtualization", phonetic: "/ˌvɜːrtʃuələˈzeɪʃn/", zh: "虛擬化", ex: "Virtualization reduces server hardware costs." },
            { en: "wireless", phonetic: "/ˈwaɪrləs/", zh: "無線的", ex: "Connect to the office wireless network." },
            { en: "xml", phonetic: "/ˌɛks ˌɛm ˈɛl/", zh: "XML 格式", ex: "XML is used for structured data exchange." },
            { en: "youtube", phonetic: "/ˈjuːˌtuːb/", zh: "YouTube 平台", ex: "Tutorial videos are hosted on YouTube." },
            { en: "zip", phonetic: "/zɪp/", zh: "壓縮檔", ex: "Extract the files from the zip archive." },
            { en: "adapter", phonetic: "/əˈdæptər/", zh: "轉接器", ex: "Plug the USB-C adapter into your laptop." },
            { en: "binary", phonetic: "/ˈbaɪnəri/", zh: "二進位", ex: "Binary search is an efficient algorithm." },
            { en: "compile", phonetic: "/kəmˈpaɪl/", zh: "編譯", ex: "Run the build script to compile the assets." },
            { en: "desktop", phonetic: "/ˈdɛskˌtɑːp/", zh: "桌面", ex: "Save temporary files on your desktop." },
            { en: "emulator", phonetic: "/ˈɛmjəˌleɪtər/", zh: "模擬器", ex: "Test mobile apps using an Android emulator." },
            { en: "firmware", phonetic: "/ˈfɜːrmˌwɛr/", zh: "韌體", ex: "Flashing new firmware fixes bugs." },
            { en: "gateway", phonetic: "/ˈɡeɪtˌweɪ/", zh: "閘道器", ex: "Secure gateways protect corporate networks." }
        ];

        // 狀態變數
        let currentIndex = 0;
        let currentFilter = 'all';
        let starredWords = JSON.parse(localStorage.getItem('cyber_starred')) || [];
        let errorQueue = JSON.parse(localStorage.getItem('cyber_errors')) || [];
        let combo = 0;
        let totalAttempts = 0;
        let totalCorrect = 0;
        let masteredSet = new Set(JSON.parse(localStorage.getItem('cyber_mastered')) || []);
        let isRecording = false;
        let recognition = null;

        // 初始化 Web Speech Recognition
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onresult = (event) => {
                const rawText = event.results[0][0].transcript;
                processRecognitionResult(rawText);
            };

            recognition.onerror = (event) => {
                console.error("Speech recognition error", event.error);
                stopRecordUI();
                showFeedback("辨識錯誤或超時，請再試一次", "wrong");
            };

            recognition.onend = () => {
                stopRecordUI();
            };
        } else {
            alert("您的瀏覽器不支援 Web Speech Recognition (建議使用 Google Chrome)");
        }

        // 初始化頁面
        document.addEventListener('DOMContentLoaded', () => {
            renderWordList();
            loadWord(0);
            updateStats();
        });

        function getActiveList() {
            if (currentFilter === 'starred') {
                return vocabList.filter((w, idx) => starredWords.includes(idx));
            } else if (currentFilter === 'errors') {
                return errorQueue.map(idx => vocabList[idx]).filter(Boolean);
            }
            return vocabList;
        }

        function loadWord(index) {
            const activeList = getActiveList();
            if (activeList.length === 0) {
                document.getElementById('currentWord').innerText = "NO_DATA";
                document.getElementById('currentPhonetic').innerText = "[ -- ]";
                document.getElementById('currentTranslation').innerText = "此分類目前沒有單字";
                document.getElementById('currentExample').innerText = `""`;
                document.getElementById('wordBadge').innerText = "STATUS: EMPTY";
                return;
            }

            if (index >= activeList.length) index = 0;
            if (index < 0) index = activeList.length - 1;

            currentIndex = index;
            const wordObj = activeList[currentIndex];
            const originalGlobalIdx = vocabList.findIndex(w => w.en === wordObj.en);

            // 更新 UI
            document.getElementById('currentWord').innerText = wordObj.en;
            document.getElementById('currentPhonetic').innerText = wordObj.phonetic;
            document.getElementById('currentTranslation').innerText = wordObj.zh;
            document.getElementById('currentExample').innerText = `"${wordObj.ex}"`;
            document.getElementById('wordBadge').innerText = `INDEX: #${String(originalGlobalIdx + 1).padStart(3, '0')} // 核心單字庫`;

            // 更新星號按鈕狀態
            const starBtn = document.getElementById('starBtn');
            if (starredWords.includes(originalGlobalIdx)) {
                starBtn.classList.add('starred');
                starBtn.innerText = "⭐ 已加入精選";
            } else {
                starBtn.classList.remove('starred');
                starBtn.innerText = "⭐ 加入精選";
            }

            // 重置反饋區
            document.getElementById('feedbackBox').innerHTML = `<span style="color: var(--text-muted)">請點擊「開始跟讀」並念出上方單字進行神經語音比對</span>`;

            highlightSidebarItem(originalGlobalIdx);
        }

        // 朗讀單字 (SpeechSynthesis)
        function speakCurrentWord() {
            const activeList = getActiveList();
            if (activeList.length === 0) return;
            const wordObj = activeList[currentIndex];

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(wordObj.en);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        // 控制錄音
        function toggleRecord() {
            if (!recognition) {
                alert("瀏覽器不支援語音辨識");
                return;
            }

            if (isRecording) {
                recognition.stop();
            } else {
                try {
                    recognition.start();
                    startRecordUI();
                } catch (e) {
                    console.error(e);
                }
            }
        }

        function startRecordUI() {
            isRecording = true;
            const btn = document.getElementById('recordBtn');
            btn.classList.add('recording');
            btn.innerText = "🛑 聆聽中...";
            showFeedback("🟢 語音神經接收中... 請清晰朗讀單字", "normal");
        }

        function stopRecordUI() {
            isRecording = false;
            const btn = document.getElementById('recordBtn');
            btn.classList.remove('recording');
            btn.innerText = "🎤 開始跟讀";
        }

        // 標準化並比對結果
        function processRecognitionResult(rawText) {
            const activeList = getActiveList();
            if (activeList.length === 0) return;
            const targetWordObj = activeList[currentIndex];
            const globalIdx = vocabList.findIndex(w => w.en === targetWordObj.en);

            // 標準化：轉小寫、去除標點符號與前後空白
            const cleanedInput = rawText.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?]/g, "").trim();
            const targetWord = targetWordObj.en.toLowerCase();

            totalAttempts++;

            if (cleanedInput === targetWord) {
                // 答對
                combo++;
                totalCorrect++;
                masteredSet.add(globalIdx);

                // 從錯題佇列中移除（如果有的話）
                errorQueue = errorQueue.filter(idx => idx !== globalIdx);
                localStorage.setItem('cyber_errors', JSON.stringify(errorQueue));

                showFeedback(`⚡ 完美命中！ 辨識結果：「${rawText}」`, "correct");
                playSuccessSound();

                // 自動跳到下一個
                setTimeout(() => {
                    nextWord();
                }, 1200);
            } else {
                // 答錯 -> 錯題過幾題後再次出現（加入佇列循環）
                combo = 0;
                if (!errorQueue.includes(globalIdx)) {
                    errorQueue.push(globalIdx);
                }
                localStorage.setItem('cyber_errors', JSON.stringify(errorQueue));

                showFeedback(`❌ 頻率不符！ 辨識為：「${rawText}」 (正確應為: ${targetWordObj.en})`, "wrong");
            }

            localStorage.setItem('cyber_mastered', JSON.stringify([...masteredSet]));
            updateStats();
            renderWordList();
        }

        function showFeedback(text, type) {
            const box = document.getElementById('feedbackBox');
            let cls = "";
            if (type === 'correct') cls = "result-correct";
            if (type === 'wrong') cls = "result-wrong";
            box.innerHTML = `<span class="${cls}">${text}</span>`;
        }

        // 簡單音效模擬 (使用 Web Audio API 嗶聲)
        function playSuccessSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15); // A5
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch(e) {}
        }

        // 導航控制
        function nextWord() {
            const activeList = getActiveList();
            if (activeList.length === 0) return;
            currentIndex = (currentIndex + 1) % activeList.length;
            loadWord(currentIndex);
        }

        function prevWord() {
            const activeList = getActiveList();
            if (activeList.length === 0) return;
            currentIndex = (currentIndex - 1 + activeList.length) % activeList.length;
            loadWord(currentIndex);
        }

        // 切換精選
        function toggleStarCurrent() {
            const activeList = getActiveList();
            if (activeList.length === 0) return;
            const wordObj = activeList[currentIndex];
            const globalIdx = vocabList.findIndex(w => w.en === wordObj.en);

            const starIdx = starredWords.indexOf(globalIdx);
            if (starIdx > -1) {
                starredWords.splice(starIdx, 1);
            } else {
                starredWords.push(globalIdx);
            }
            localStorage.setItem('cyber_starred', JSON.stringify(starredWords));
            loadWord(currentIndex);
            renderWordList();
        }

        // 過濾頁籤
        function switchFilter(filter, btnEl) {
            currentFilter = filter;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
            currentIndex = 0;
            loadWord(0);
            renderWordList();
        }

        // 渲染側邊單字清單
        function renderWordList() {
            const container = document.getElementById('wordListContainer');
            const activeList = getActiveList();
            container.innerHTML = '';

            document.getElementById('listCounter').innerText = `${activeList.length} Words`;

            activeList.forEach((w, idx) => {
                const globalIdx = vocabList.findIndex(item => item.en === w.en);
                const item = document.createElement('div');
                item.className = `word-item ${idx === currentIndex ? 'active' : ''}`;
                item.onclick = () => {
                    currentIndex = idx;
                    loadWord(currentIndex);
                };

                const isStarred = starredWords.includes(globalIdx);
                const isError = errorQueue.includes(globalIdx);

                let tagHtml = '';
                if (isStarred) tagHtml += '⭐ ';
                if (isError) tagHtml += '⚠️ ';

                item.innerHTML = `
                    <div class="word-item-info">
                        <div class="en">${tagHtml}${w.en}</div>
                        <div class="zh">${w.zh}</div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function highlightSidebarItem(globalIdx) {
            renderWordList();
        }

        // 更新數據面板
        function updateStats() {
            document.getElementById('comboCount').innerText = combo;
            const accuracy = totalAttempts > 0 ? Math.round((totalCorrect / totalAttempts) * 100) : 0;
            document.getElementById('accuracyRate').innerText = accuracy + '%';
            document.getElementById('errorQueueCount').innerText = errorQueue.length;
            document.getElementById('masteredCount').innerText = `${masteredSet.size} / 100`;
        }
    </script>
</body>
