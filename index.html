<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEURAL-SYNC // AI 英文聽讀特訓</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#030712',
                            card: '#0b0f19',
                            border: '#1e3a8a',
                            blue: '#3b82f6',
                            neonBlue: '#00f0ff',
                            neonGreen: '#00ff66',
                            neonPink: '#ff0055',
                            neonYellow: '#fde047',
                            darkBlue: '#172554'
                        }
                    },
                    boxShadow: {
                        'neon-blue': '0 0 15px rgba(0, 240, 255, 0.4)',
                        'neon-green': '0 0 15px rgba(0, 255, 102, 0.4)',
                        'neon-pink': '0 0 15px rgba(255, 0, 85, 0.4)',
                        'cyber-panel': 'inset 0 0 20px rgba(30, 58, 138, 0.2)'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Orbitron & Share Tech Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Share+Tech+Mono&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #030712;
            color: #f3f4f6;
            overflow-x: hidden;
        }
        .font-cyber {
            font-family: 'Orbitron', sans-serif;
        }
        .font-mono-tech {
            font-family: 'Share Tech Mono', monospace;
        }
        /* Grid background effect */
        .cyber-grid {
            background-image: linear-gradient(to right, rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }
        /* Scanline overlay */
        .scanline {
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0, 0, 0, 0.3) 50%, rgba(0, 0, 0, 0.3));
            background-size: 100% 4px;
        }
        /* Glowing neon border animation */
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 10px rgba(0, 240, 255, 0.3); }
            50% { box-shadow: 0 0 25px rgba(0, 240, 255, 0.7); }
        }
        .pulse-border {
            animation: pulseGlow 2.5s infinite ease-in-out;
        }
        /* Audio wave animation */
        @keyframes wave {
            0%, 100% { height: 6px; }
            50% { height: 40px; }
        }
        .wave-bar {
            animation: wave 1.2s infinite ease-in-out;
        }
        .wave-bar:nth-child(2) { animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { animation-delay: 0.4s; }
        .wave-bar:nth-child(6) { animation-delay: 0.5s; }
    </style>
</head>
<body class="cyber-grid min-h-screen relative flex flex-col select-none">
    <!-- Scanline overlay -->
    <div class="scanline fixed inset-0 pointer-events-none z-50 opacity-40"></div>

    <!-- HEADER / NAVIGATION -->
    <header class="border-b border-cyber-border/60 bg-cyber-card/80 backdrop-blur-md sticky top-0 z-40 px-4 py-3">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded bg-blue-950/80 border border-cyber-neonBlue flex items-center justify-center text-cyber-neonBlue shadow-neon-blue">
                    <i class="fa-solid fa-microphone-lines text-xl"></i>
                </div>
                <div>
                    <h1 class="font-cyber font-black tracking-widest text-lg text-cyber-neonBlue flex items-center gap-2">
                        NEURAL-SYNC <span class="text-xs px-2 py-0.5 rounded bg-blue-900/50 border border-blue-500 text-blue-300 font-mono-tech">v2.4.9</span>
                    </h1>
                    <p class="text-xs text-slate-400 font-mono-tech">AI 語音神經同步與發音特訓系統</p>
                </div>
            </div>

            <!-- Stats Ticker -->
            <div class="flex items-center gap-4 bg-cyber-bg/90 border border-cyber-border px-4 py-2 rounded-lg text-xs font-mono-tech">
                <div class="flex items-center gap-1.5 text-cyber-neonBlue" title="已練習題數">
                    <i class="fa-solid fa-chart-line"></i>
                    <span>已訓: <strong id="stat-total" class="text-white">0</strong></span>
                </div>
                <div class="w-px h-4 bg-cyber-border"></div>
                <div class="flex items-center gap-1.5 text-cyber-neonGreen" title="正確率">
                    <i class="fa-solid fa-bullseye"></i>
                    <span>精準度: <strong id="stat-accuracy" class="text-white">100%</strong></span>
                </div>
                <div class="w-px h-4 bg-cyber-border"></div>
                <div class="flex items-center gap-1.5 text-cyber-neonYellow" title="連擊 Combo">
                    <i class="fa-solid fa-bolt"></i>
                    <span>COMBO: <strong id="stat-streak" class="text-white">0</strong></span>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6 flex flex-col gap-6 z-10">

        <!-- NAV TABS -->
        <div class="flex border-b border-cyber-border gap-2 overflow-x-auto pb-1">
            <button onclick="switchTab('trainer')" id="tab-trainer" class="px-5 py-2.5 font-cyber text-sm tracking-wider rounded-t-lg transition-all border-t border-x border-cyber-neonBlue bg-cyber-card text-cyber-neonBlue shadow-neon-blue flex items-center gap-2">
                <i class="fa-solid fa-brain"></i> 語音特訓艙
            </button>
            <button onclick="switchTab('library')" id="tab-library" class="px-5 py-2.5 font-cyber text-sm tracking-wider rounded-t-lg transition-all border border-transparent text-slate-400 hover:text-slate-200 hover:bg-cyber-card/50 flex items-center gap-2">
                <i class="fa-solid fa-database"></i> 數據庫與精選單字 (<span id="lib-count">0</span>)
            </button>
            <button onclick="switchTab('wrong')" id="tab-wrong" class="px-5 py-2.5 font-cyber text-sm tracking-wider rounded-t-lg transition-all border border-transparent text-slate-400 hover:text-slate-200 hover:bg-cyber-card/50 flex items-center gap-2">
                <i class="fa-solid fa-triangle-exclamation text-cyber-neonPink"></i> 錯誤矯正佇列 (<span id="wrong-count">0</span>)
            </button>
        </div>

        <!-- ================= SECTION 1: TRAINER ================= -->
        <section id="section-trainer" class="flex flex-col gap-6">
            <!-- Mode Selector Bar -->
            <div class="bg-cyber-card border border-cyber-border/80 rounded-xl p-4 flex flex-wrap items-center justify-between gap-4 shadow-cyber-panel">
                <div class="flex items-center gap-3">
                    <span class="text-xs font-mono-tech text-slate-400 uppercase tracking-widest"><i class="fa-solid fa-sliders text-cyber-neonBlue mr-1"></i> 訓練模式:</span>
                    <select id="mode-select" onchange="changeMode()" class="bg-cyber-bg border border-cyber-border text-slate-200 text-sm rounded-lg px-3 py-1.5 focus:outline-none focus:border-cyber-neonBlue font-mono-tech">
                        <option value="all">全域資料庫 (All Database)</option>
                        <option value="favorites">精選單字庫 (Favorites Only)</option>
                        <option value="wrongQueue">錯誤矯正特訓 (Error Queue)</option>
                        <option value="level-basic">級別: 初級日常 (Basic)</option>
                        <option value="level-tech">級別: 科技商務 (Tech & Business)</option>
                        <option value="level-advanced">級別: 高級片語 (Advanced)</option>
                    </select>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="resetSessionStats()" class="px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-900 text-xs text-slate-300 hover:border-slate-500 transition-all font-mono-tech flex items-center gap-1.5">
                        <i class="fa-solid fa-rotate-right"></i> 重置進度
                    </button>
                </div>
            </div>

            <!-- Card Arena -->
            <div id="trainer-card-container" class="relative bg-cyber-card border-2 border-cyber-border rounded-2xl p-6 md:p-10 flex flex-col items-center text-center shadow-2xl transition-all duration-300">
                <!-- Top Badge Row -->
                <div class="w-full flex items-center justify-between mb-4">
                    <span id="card-category" class="px-3 py-1 rounded-full bg-blue-950 border border-blue-600 text-blue-300 text-xs font-mono-tech tracking-wider uppercase">
                        Category
                    </span>
                    <button onclick="toggleCurrentFavorite()" id="favorite-btn" class="text-slate-500 hover:text-cyber-neonYellow text-xl transition-colors" title="加入精選單字庫">
                        <i class="fa-regular fa-star"></i>
                    </button>
                </div>

                <!-- Word Display -->
                <div class="my-6">
                    <h2 id="card-word" class="font-cyber font-black text-4xl md:text-6xl text-white tracking-wide mb-2 drop-shadow-md">
                        Loading...
                    </h2>
                    <p id="card-phonetic" class="text-cyber-neonBlue font-mono-tech text-lg tracking-widest opacity-80"></p>
                </div>

                <!-- Meaning & Example -->
                <div class="max-w-xl bg-cyber-bg/70 border border-cyber-border/50 rounded-xl p-4 mb-8 text-left w-full">
                    <div class="text-xs font-mono-tech text-slate-400 mb-1 flex items-center gap-1">
                        <i class="fa-solid fa-terminal text-cyber-neonBlue"></i> 中文釋義:
                    </div>
                    <div id="card-meaning" class="text-slate-200 font-medium text-base mb-3">請稍候...</div>
                    <div class="text-xs font-mono-tech text-slate-400 mb-1 flex items-center gap-1">
                        <i class="fa-solid fa-quote-left text-cyber-neonPink"></i> 實戰例句:
                    </div>
                    <div id="card-example" class="text-slate-300 text-sm italic">...</div>
                </div>

                <!-- Audio Play Button -->
                <div class="flex items-center gap-4 mb-8">
                    <button onclick="speakCurrentWord()" class="group relative px-6 py-3 rounded-xl bg-blue-950 border border-cyber-neonBlue text-cyber-neonBlue font-cyber text-sm tracking-wider shadow-neon-blue hover:bg-blue-900 transition-all flex items-center gap-2">
                        <i class="fa-solid fa-volume-high text-lg"></i> 播放正確發音
                    </button>
                </div>

                <!-- Interactive Record / Speech Recognition Area -->
                <div class="w-full max-w-md flex flex-col items-center gap-4">
                    <button id="record-btn" onclick="toggleSpeechRecognition()" class="w-20 h-20 rounded-full bg-slate-900 border-2 border-cyber-neonBlue text-cyber-neonBlue flex items-center justify-center text-3xl shadow-neon-blue hover:scale-105 active:scale-95 transition-all">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                    <div id="record-status" class="text-xs font-mono-tech text-slate-400 tracking-wider">
                        點擊麥克風開始跟讀發音
                    </div>

                    <!-- Waveform Animation Container (Hidden by default) -->
                    <div id="waveform-box" class="hidden items-center justify-center gap-1.5 h-12 w-full bg-slate-950/80 border border-cyber-border rounded-xl">
                        <div class="w-1 bg-cyber-neonBlue rounded-full wave-bar"></div>
                        <div class="w-1 bg-cyber-neonBlue rounded-full wave-bar"></div>
                        <div class="w-1 bg-cyber-neonBlue rounded-full wave-bar"></div>
                        <div class="w-1 bg-cyber-neonBlue rounded-full wave-bar"></div>
                        <div class="w-1 bg-cyber-neonBlue rounded-full wave-bar"></div>
                        <div class="w-1 bg-cyber-neonBlue rounded-full wave-bar"></div>
                        <span class="text-xs font-mono-tech text-cyber-neonBlue ml-2 animate-pulse">正在接收語音神經頻譜...</span>
                    </div>

                    <!-- Recognition Feedback Box -->
                    <div id="feedback-box" class="w-full hidden p-4 rounded-xl border text-left transition-all">
                        <div class="flex items-center justify-between mb-1">
                            <span id="feedback-title" class="font-cyber font-bold text-sm tracking-wide">辨識結果</span>
                            <span id="feedback-score" class="font-mono-tech text-xs px-2 py-0.5 rounded"></span>
                        </div>
                        <div class="text-xs font-mono-tech text-slate-300 mt-1">
                            辨識文字: <span id="recognized-text" class="text-white font-bold underline"></span>
                        </div>
                    </div>
                </div>

                <!-- Navigation Controls -->
                <div class="w-full flex items-center justify-between mt-8 pt-6 border-t border-cyber-border/60">
                    <button onclick="prevCard()" class="px-4 py-2 rounded-lg bg-cyber-bg border border-cyber-border text-xs font-mono-tech text-slate-300 hover:text-white hover:border-slate-500 transition-all">
                        <i class="fa-solid fa-arrow-left mr-1"></span> 上一個
                    </button>
                    <span id="card-progress-text" class="text-xs font-mono-tech text-slate-400">0 / 0</span>
                    <button onclick="nextCard()" class="px-4 py-2 rounded-lg bg-blue-950/60 border border-cyber-neonBlue text-xs font-cyber text-cyber-neonBlue hover:bg-blue-900 transition-all">
                        下一個 <i class="fa-solid fa-arrow-right ml-1"></i>
                    </button>
                </div>
            </div>
        </section>

        <!-- ================= SECTION 2: LIBRARY ================= -->
        <section id="section-library" class="hidden flex flex-col gap-4">
            <div class="bg-cyber-card border border-cyber-border rounded-xl p-4 flex flex-col md:flex-row items-center justify-between gap-4">
                <div class="relative w-full md:w-80">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-500 text-sm"></i>
                    <input type="text" id="lib-search" oninput="renderLibraryList()" placeholder="搜尋單字、釋義..." class="w-full bg-cyber-bg border border-cyber-border rounded-lg pl-9 pr-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-cyber-neonBlue font-mono-tech">
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="filterLibCategory('all')" class="lib-filter-btn px-3 py-1.5 rounded-lg border border-cyber-neonBlue bg-blue-950 text-xs text-cyber-neonBlue font-mono-tech">全部</button>
                    <button onclick="filterLibCategory('favorites')" class="lib-filter-btn px-3 py-1.5 rounded-lg border border-cyber-border bg-cyber-bg text-xs text-slate-400 font-mono-tech"><i class="fa-solid fa-star text-cyber-neonYellow mr-1"></i> 精選</button>
                    <button onclick="filterLibCategory('tech')" class="lib-filter-btn px-3 py-1.5 rounded-lg border border-cyber-border bg-cyber-bg text-xs text-slate-400 font-mono-tech">科技商務</button>
                </div>
            </div>

            <!-- Words Grid -->
            <div id="library-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Dynamic cards injected via JS -->
            </div>
        </section>

        <!-- ================= SECTION 3: WRONG QUEUE ================= -->
        <section id="section-wrong" class="hidden flex flex-col gap-4">
            <div class="bg-cyber-card border border-cyber-border rounded-xl p-6 text-center">
                <div class="w-12 h-12 rounded-full bg-pink-950 border border-cyber-neonPink text-cyber-neonPink mx-auto flex items-center justify-center text-xl mb-3 shadow-neon-pink">
                    <i class="fa-solid fa-shield-cat"></i>
                </div>
                <h3 class="font-cyber font-bold text-lg text-white mb-1">錯誤矯正特訓專區</h3>
                <p class="text-xs text-slate-400 font-mono-tech max-w-md mx-auto mb-4">
                    系統會自動攔截您在訓練中唸錯的單字，並在經過數題後排入複習迴圈。徹底擊破您的發音盲點！
                </p>
                <div id="wrong-container" class="flex flex-col gap-3">
                    <!-- Wrong items populated here -->
                </div>
            </div>
        </section>

    </main>

    <!-- FOOTER -->
    <footer class="mt-auto border-t border-cyber-border/60 bg-cyber-card/60 py-3 text-center text-xs font-mono-tech text-slate-500">
        NEURAL-SYNC SYSTEM &copy; 2026 // WEB SPEECH API SECURE PROTOCOL
    </footer>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none bg-cyber-card border border-cyber-neonBlue text-white px-4 py-3 rounded-xl shadow-neon-blue flex items-center gap-3">
        <i id="toast-icon" class="fa-solid fa-circle-check text-cyber-neonGreen text-lg"></i>
        <div class="text-sm font-mono-tech" id="toast-msg">提示訊息</div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        /* ================= 1. WORD DATABASE ================= */
        const rawVocabDatabase = [
            { id: 1, word: "Neural", phonetic: "/ˈnʊrəl/", category: "Tech & Business", level: "level-tech", meaning: "神經元的、神經系統的", example: "Neural networks process information similarly to human brains." },
            { id: 2, word: "Algorithm", phonetic: "/ˈælɡəˌrɪðəm/", category: "Tech & Business", level: "level-tech", meaning: "演算法、計算程序", example: "The recommendation algorithm suggests relevant items." },
            { id: 3, word: "Encryption", phonetic: "/ɪnˈkrɪpʃən/", category: "Tech & Business", level: "level-tech", meaning: "加密、密碼編譯", example: "End-to-end encryption ensures secure communication." },
            { id: 4, word: "Protocol", phonetic: "/ˈproʊtəˌkɔl/", category: "Tech & Business", level: "level-tech", meaning: "協定、通訊協定、規約", example: "All devices must follow the network communication protocol." },
            { id: 5, word: "Synchronize", phonetic: "/ˈsɪŋkrəˌnaɪz/", category: "Tech & Business", level: "level-tech", meaning: "使同步、同時發生", example: "Data will synchronize automatically across all your devices." },
            { id: 6, word: "Architecture", phonetic: "/ˈɑrkəˌtɛktʃər/", category: "Tech & Business", level: "level-tech", meaning: "架構、結構設計", example: "The software architecture is designed for high scalability." },
            { id: 7, word: "Breakthrough", phonetic: "/ˈbreɪkˌθru/", category: "Advanced", level: "level-advanced", meaning: "重大突破、重大發現", example: "Scientists made a major breakthrough in quantum computing." },
            { id: 8, word: "Resilient", phonetic: "/rɪˈzɪliənt/", category: "Advanced", level: "level-advanced", meaning: "具彈性的、有韌性的、復原力強的", example: "We need a resilient supply chain to withstand global shocks." },
            { id: 9, word: "Innovative", phonetic: "/ˈɪnəˌveɪtɪv/", category: "Advanced", level: "level-advanced", meaning: "創新的、革新的", example: "Her innovative approach solved the long-standing bug." },
            { id: 10, word: "Optimization", phonetic: "/ˌɑptəməˈzeɪʃən/", category: "Tech & Business", level: "level-tech", meaning: "最佳化、最優化", example: "Database optimization significantly reduced query latency." },
            { id: 11, word: "Ambition", phonetic: "/æmˈbɪʃən/", category: "Daily Basic", level: "level-basic", meaning: "抱負、野心、追求", example: "He has a strong ambition to excel in AI research." },
            { id: 12, word: "Collaborate", phonetic: "/kəˈlæbəˌreɪt/", category: "Daily Basic", level: "level-basic", meaning: "合作、協力", example: "Teams collaborate remotely using cloud platforms." },
            { id: 13, word: "Perspective", phonetic: "/pərˈspɛktɪv/", category: "Daily Basic", level: "level-basic", meaning: "觀點、視角、遠景", example: "Try to look at the problem from a different perspective." },
            { id: 14, word: "Autonomous", phonetic: "/ɔˈtɑnəməs/", category: "Tech & Business", level: "level-tech", meaning: "自主的、自動駕駛的", example: "Autonomous vehicles rely heavily on real-time sensors." },
            { id: 15, word: "Vulnerability", phonetic: "/ˌvʌlnərəˈbɪləti/", category: "Advanced", level: "level-advanced", meaning: "脆弱性、漏洞、弱點", example: "Security patches were released to fix the system vulnerability." }
        ];

        // State Management
        let vocabulary = [...rawVocabDatabase];
        let favoriteIds = JSON.parse(localStorage.getItem('cyber_favorites')) || [1, 2, 5];
        let wrongQueue = JSON.parse(localStorage.getItem('cyber_wrong_queue')) || [];
        
        let currentMode = 'all';
        let activeList = [];
        let currentIndex = 0;
        
        // Stats
        let statsTotal = parseInt(localStorage.getItem('cyber_stat_total')) || 0;
        let statsCorrect = parseInt(localStorage.getItem('cyber_stat_correct')) || 0;
        let statsStreak = parseInt(localStorage.getItem('cyber_stat_streak')) || 0;

        // Speech Recognition instance
        let recognition = null;
        let isRecording = false;

        // Initialization on window load
        window.onload = function() {
            initSpeechRecognition();
            changeMode();
            updateStatsUI();
            renderLibraryList();
            renderWrongQueue();
        };

        /* ================= 2. SPEECH SYNTHESIS & RECOGNITION ================= */
        function speakCurrentWord() {
            if (!activeList.length) return;
            const currentItem = activeList[currentIndex];
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop previous utterance
                const utterance = new SpeechSynthesisUtterance(currentItem.word);
                utterance.lang = 'en-US';
                utterance.rate = 0.9; // Slightly slower for training clarity
                window.speechSynthesis.speak(utterance);
                showToast(`正在發音: ${currentItem.word}`, 'info');
            } else {
                showToast('您的瀏覽器不支援語音合成', 'error');
            }
        }

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                showToast('您的瀏覽器不支援 Web Speech Recognition，建議使用 Chrome', 'error');
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = function() {
                isRecording = true;
                document.getElementById('record-btn').classList.add('bg-blue-900', 'border-cyber-neonGreen', 'animate-pulse');
                document.getElementById('record-status').innerText = '聆聽中... 請清晰跟讀單字';
                document.getElementById('waveform-box').classList.remove('hidden');
                document.getElementById('waveform-box').classList.add('flex');
            };

            recognition.onresult = function(event) {
                const speechToText = event.results[0][0].transcript;
                processRecognitionResult(speechToText);
            };

            recognition.onerror = function(event) {
                console.error('Speech recognition error', event.error);
                stopRecordingUI();
                showToast('語音辨識發生錯誤或未收到語音', 'error');
            };

            recognition.onend = function() {
                stopRecordingUI();
            };
        }

        function toggleSpeechRecognition() {
            if (!recognition) {
                showToast('語音辨識尚未初始化或不支援', 'error');
                return;
            }
            if (isRecording) {
                recognition.stop();
            } else {
                try {
                    recognition.start();
                } catch(e) {
                    console.error(e);
                }
            }
        }

        function stopRecordingUI() {
            isRecording = false;
            const btn = document.getElementById('record-btn');
            if (btn) {
                btn.classList.remove('bg-blue-900', 'border-cyber-neonGreen', 'animate-pulse');
            }
            const statusEl = document.getElementById('record-status');
            if (statusEl) statusEl.innerText = '點擊麥克風開始跟讀發音';
            const wave = document.getElementById('waveform-box');
            if (wave) {
                wave.classList.remove('flex');
                wave.classList.add('hidden');
            }
        }

        /* ================= 3. TEXT NORMALIZATION & COMPARISON ================= */
        function normalizeText(text) {
            if (!text) return '';
            return text
                .toLowerCase()
                .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?"'?!]/g, '') // Remove punctuation
                .replace(/\s+/g, ' ') // Replace multiple spaces with single
                .trim();
        }

        function processRecognitionResult(spokenText) {
            if (!activeList.length) return;
            const currentItem = activeList[currentIndex];
            
            const normalizedSpoken = normalizeText(spokenText);
            const normalizedTarget = normalizeText(currentItem.word);

            const isCorrect = (normalizedSpoken === normalizedTarget);

            // Update stats
            statsTotal++;
            if (isCorrect) {
                statsCorrect++;
                statsStreak++;
                showFeedback(true, spokenText, "完美同步！發音精準無誤 (+1 COMBO)");
                
                // If it was in wrong queue, remove it if answered correctly
                removeFromWrongQueue(currentItem.id);
            } else {
                statsStreak = 0;
                showFeedback(false, spokenText, `發音偏離！目標應為: "${currentItem.word}"`);
                
                // Add to wrong queue for spaced repetition/retry loop
                addToWrongQueue(currentItem);
            }

            updateStatsUI();
            saveStats();

            // Auto advance after 2.5 seconds if correct
            if (isCorrect) {
                setTimeout(() => {
                    nextCard();
                }, 2200);
            }
        }

        function showFeedback(isCorrect, spokenText, message) {
            const box = document.getElementById('feedback-box');
            const title = document.getElementById('feedback-title');
            const score = document.getElementById('feedback-score');
            const textEl = document.getElementById('recognized-text');

            box.classList.remove('hidden');
            textEl.innerText = spokenText || '(無辨識內容)';

            if (isCorrect) {
                box.className = "w-full p-4 rounded-xl border border-cyber-neonGreen bg-green-950/40 text-left transition-all shadow-neon-green";
                title.className = "font-cyber font-bold text-sm text-cyber-neonGreen";
                title.innerHTML = `<i class="fa-solid fa-circle-check mr-1"></i> 念對了！ [MATCH SUCCESS]`;
                score.className = "font-mono-tech text-xs px-2 py-0.5 rounded bg-green-900 text-green-200 border border-green-500";
                score.innerText = "ACCURACY: 100%";
            } else {
                box.className = "w-full p-4 rounded-xl border border-cyber-neonPink bg-pink-950/40 text-left transition-all shadow-neon-pink";
                title.className = "font-cyber font-bold text-sm text-cyber-neonPink";
                title.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-1"></i> 念錯了！ [MISMATCH ALERT]`;
                score.className = "font-mono-tech text-xs px-2 py-0.5 rounded bg-pink-900 text-pink-200 border border-pink-500";
                score.innerText = "MISMATCH";
            }
        }

        /* ================= 4. WRONG QUEUE LOGIC ================= */
        function addToWrongQueue(item) {
            // Check if already exists
            const exists = wrongQueue.some(i => i.id === item.id);
            if (!exists) {
                wrongQueue.push({ ...item, failCount: 1 });
            } else {
                wrongQueue = wrongQueue.map(i => i.id === item.id ? { ...i, failCount: (i.failCount || 1) + 1 } : i);
            }
            saveWrongQueue();
            renderWrongQueue();
        }

        function removeFromWrongQueue(id) {
            wrongQueue = wrongQueue.filter(i => i.id !== id);
            saveWrongQueue();
            renderWrongQueue();
        }

        function saveWrongQueue() {
            localStorage.setItem('cyber_wrong_queue', JSON.stringify(wrongQueue));
            document.getElementById('wrong-count').innerText = wrongQueue.length;
        }

        function renderWrongQueue() {
            const container = document.getElementById('wrong-container');
            document.getElementById('wrong-count').innerText = wrongQueue.length;
            
            if (wrongQueue.length === 0) {
                container.innerHTML = `<div class="text-xs font-mono-tech text-slate-500 py-6">目前沒有錯誤矯正佇列，表現優異！</div>`;
                return;
            }

            container.innerHTML = wrongQueue.map(item => `
                <div class="flex items-center justify-between bg-cyber-bg border border-cyber-border p-3 rounded-lg">
                    <div class="text-left">
                        <div class="font-cyber font-bold text-cyber-neonPink text-sm">${item.word}</div>
                        <div class="text-xs text-slate-400 font-mono-tech">${item.meaning}</div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="practiceSpecificWord(${item.id})" class="px-3 py-1 bg-blue-950 border border-cyber-neonBlue text-xs text-cyber-neonBlue rounded font-mono-tech hover:bg-blue-900">
                            立即特訓
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function practiceSpecificWord(id) {
            const found = vocabulary.find(v => v.id === id);
            if (found) {
                activeList = [found];
                currentIndex = 0;
                switchTab('trainer');
                renderCurrentCard();
            }
        }

        /* ================= 5. NAVIGATION & MODES ================= */
        function changeMode() {
            const select = document.getElementById('mode-select');
            currentMode = select.value;

            if (currentMode === 'all') {
                activeList = [...vocabulary];
            } else if (currentMode === 'favorites') {
                activeList = vocabulary.filter(v => favoriteIds.includes(v.id));
            } else if (currentMode === 'wrongQueue') {
                activeList = [...wrongQueue];
            } else if (currentMode.startsWith('level-')) {
                activeList = vocabulary.filter(v => v.level === currentMode);
            }

            // Shuffle slightly or randomize for fun practice
            shuffleArray(activeList);
            currentIndex = 0;

            if (activeList.length === 0) {
                showEmptyCardState();
            } else {
                renderCurrentCard();
            }
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function renderCurrentCard() {
            if (!activeList.length) {
                showEmptyCardState();
                return;
            }

            const item = activeList[currentIndex];
            document.getElementById('card-category').innerText = item.category;
            document.getElementById('card-word').innerText = item.word;
            document.getElementById('card-phonetic').innerText = item.phonetic;
            document.getElementById('card-meaning').innerText = item.meaning;
            document.getElementById('card-example').innerText = `"${item.example}"`;
            document.getElementById('card-progress-text').innerText = `${currentIndex + 1} / ${activeList.length}`;

            // Hide previous feedback
            document.getElementById('feedback-box').classList.add('hidden');

            // Update favorite star
            updateFavoriteStarUI(item.id);
        }

        function showEmptyCardState() {
            document.getElementById('card-category').innerText = "SYSTEM NOTICE";
            document.getElementById('card-word').innerText = "無可用字彙";
            document.getElementById('card-phonetic').innerText = "/nʌn/";
            document.getElementById('card-meaning').innerText = "此分類目前沒有字彙或已被清空。";
            document.getElementById('card-example').innerText = `"Please select another training mode or add items to favorites."`;
            document.getElementById('card-progress-text').innerText = "0 / 0";
            document.getElementById('feedback-box').classList.add('hidden');
        }

        function nextCard() {
            if (!activeList.length) return;
            currentIndex = (currentIndex + 1) % activeList.length;
            renderCurrentCard();
        }

        function prevCard() {
            if (!activeList.length) return;
            currentIndex = (currentIndex - 1 + activeList.length) % activeList.length;
            renderCurrentCard();
        }

        /* ================= 6. FAVORITES & LIBRARY ================= */
        function toggleCurrentFavorite() {
            if (!activeList.length) return;
            const item = activeList[currentIndex];
            const idx = favoriteIds.indexOf(item.id);
            if (idx > -1) {
                favoriteIds.splice(idx, 1);
                showToast(`已從精選單字移除: ${item.word}`, 'info');
            } else {
                favoriteIds.push(item.id);
                showToast(`已加入精選單字庫: ${item.word}`, 'success');
            }
            localStorage.setItem('cyber_favorites', JSON.stringify(favoriteIds));
            updateFavoriteStarUI(item.id);
            renderLibraryList();
        }

        function updateFavoriteStarUI(id) {
            const btn = document.getElementById('favorite-btn');
            if (favoriteIds.includes(id)) {
                btn.innerHTML = `<i class="fa-solid fa-star text-cyber-neonYellow"></i>`;
            } else {
                btn.innerHTML = `<i class="fa-regular fa-star text-slate-500"></i>`;
            }
        }

        let libFilter = 'all';
        function filterLibCategory(cat) {
            libFilter = cat;
            document.querySelectorAll('.lib-filter-btn').forEach(btn => {
                btn.classList.remove('border-cyber-neonBlue', 'bg-blue-950', 'text-cyber-neonBlue');
                btn.classList.add('border-cyber-border', 'bg-cyber-bg', 'text-slate-400');
            });
            event.currentTarget.classList.remove('border-cyber-border', 'bg-cyber-bg', 'text-slate-400');
            event.currentTarget.classList.add('border-cyber-neonBlue', 'bg-blue-950', 'text-cyber-neonBlue');
            renderLibraryList();
        }

        function renderLibraryList() {
            const searchVal = document.getElementById('lib-search').value.toLowerCase();
            const grid = document.getElementById('library-grid');
            document.getElementById('lib-count').innerText = vocabulary.length;

            let filtered = vocabulary.filter(item => {
                const matchSearch = item.word.toLowerCase().includes(searchVal) || item.meaning.includes(searchVal);
                if (libFilter === 'favorites') return matchSearch && favoriteIds.includes(item.id);
                if (libFilter === 'tech') return matchSearch && item.level === 'level-tech';
                return matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-8 text-center text-xs font-mono-tech text-slate-500">找不到符合條件的單字資料。</div>`;
                return;
            }

            grid.innerHTML = filtered.map(item => {
                const isFav = favoriteIds.includes(item.id);
                return `
                    <div class="bg-cyber-card border border-cyber-border rounded-xl p-4 flex flex-col justify-between gap-3 hover:border-cyber-neonBlue transition-all">
                        <div class="flex items-start justify-between">
                            <div>
                                <span class="text-[10px] font-mono-tech px-2 py-0.5 rounded bg-blue-950 border border-blue-800 text-blue-300">${item.category}</span>
                                <h4 class="font-cyber font-bold text-lg text-white mt-1">${item.word}</h4>
                                <span class="text-xs font-mono-tech text-cyber-neonBlue">${item.phonetic}</span>
                            </div>
                            <button onclick="toggleFavFromLib(${item.id})" class="text-lg ${isFav ? 'text-cyber-neonYellow' : 'text-slate-600 hover:text-slate-400'}">
                                <i class="${isFav ? 'fa-solid fa-star' : 'fa-regular fa-star'}"></i>
                            </button>
                        </div>
                        <p class="text-xs text-slate-300">${item.meaning}</p>
                        <div class="flex items-center justify-between pt-2 border-t border-cyber-border/40">
                            <span class="text-[10px] font-mono-tech text-slate-500 italic truncate max-w-[200px]">"${item.example}"</span>
                            <button onclick="practiceSpecificWord(${item.id})" class="px-2.5 py-1 bg-blue-950/60 border border-cyber-neonBlue text-[10px] font-cyber text-cyber-neonBlue rounded hover:bg-blue-900">
                                特訓
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleFavFromLib(id) {
            const idx = favoriteIds.indexOf(id);
            if (idx > -1) {
                favoriteIds.splice(idx, 1);
            } else {
                favoriteIds.push(id);
            }
            localStorage.setItem('cyber_favorites', JSON.stringify(favoriteIds));
            renderLibraryList();
            if (activeList.length && activeList[currentIndex].id === id) {
                updateFavoriteStarUI(id);
            }
        }

        /* ================= 7. STATS & UI HELPERS ================= */
        function updateStatsUI() {
            document.getElementById('stat-total').innerText = statsTotal;
            const accuracy = statsTotal > 0 ? Math.round((statsCorrect / statsTotal) * 100) : 100;
            document.getElementById('stat-accuracy').innerText = accuracy + '%';
            document.getElementById('stat-streak').innerText = statsStreak;
        }

        function saveStats() {
            localStorage.setItem('cyber_stat_total', statsTotal);
            localStorage.setItem('cyber_stat_correct', statsCorrect);
            localStorage.setItem('cyber_stat_streak', statsStreak);
        }

        function resetSessionStats() {
            statsTotal = 0;
            statsCorrect = 0;
            statsStreak = 0;
            saveStats();
            updateStatsUI();
            showToast('統計數據已重置', 'info');
        }

        function switchTab(tabName) {
            ['trainer', 'library', 'wrong'].forEach(t => {
                document.getElementById(`section-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).className = "px-5 py-2.5 font-cyber text-sm tracking-wider rounded-t-lg transition-all border border-transparent text-slate-400 hover:text-slate-200 hover:bg-cyber-card/50 flex items-center gap-2";
            });

            document.getElementById(`section-${tabName}`).classList.remove('hidden');
            const activeTab = document.getElementById(`tab-${tabName}`);
            activeTab.className = "px-5 py-2.5 font-cyber text-sm tracking-wider rounded-t-lg transition-all border-t border-x border-cyber-neonBlue bg-cyber-card text-cyber-neonBlue shadow-neon-blue flex items-center gap-2";
        }

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.innerText = msg;
            if (type === 'success') {
                toast.className = "fixed bottom-6 right-6 z-50 transform translate-y-0 opacity-100 transition-all duration-300 pointer-events-none bg-cyber-card border border-cyber-neonGreen text-white px-4 py-3 rounded-xl shadow-neon-green flex items-center gap-3";
                toastIcon.className = "fa-solid fa-circle-check text-cyber-neonGreen text-lg";
            } else if (type === 'error') {
                toast.className = "fixed bottom-6 right-6 z-50 transform translate-y-0 opacity-100 transition-all duration-300 pointer-events-none bg-cyber-card border border-cyber-neonPink text-white px-4 py-3 rounded-xl shadow-neon-pink flex items-center gap-3";
                toastIcon.className = "fa-solid fa-triangle-exclamation text-cyber-neonPink text-lg";
            } else {
                toast.className = "fixed bottom-6 right-6 z-50 transform translate-y-0 opacity-100 transition-all duration-300 pointer-events-none bg-cyber-card border border-cyber-neonBlue text-white px-4 py-3 rounded-xl shadow-neon-blue flex items-center gap-3";
                toastIcon.className = "fa-solid fa-circle-info text-cyber-neonBlue text-lg";
            }

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
